name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & accept licenses
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          # Locate any available sdkmanager (prefer the newest cmdline-tools)
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: no sdkmanager found under $ANDROID_HOME/cmdline-tools"
            ls -R "$ANDROID_HOME/cmdline-tools" 2>/dev/null || true
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          echo "Using ANDROID_HOME=$ANDROID_HOME"

          # Accept all Android SDK licenses non-interactively
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # Belt-and-suspenders: write accepted license hashes directly so
          # AGP can auto-install any missing platform / build-tools.
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf '%s\n' "601085b94cd77f0b54ff86406957099ebe79c4d6" \
            > "$ANDROID_HOME/licenses/android-googletv-license"

      - name: Install required Android SDK packages (platform, build-tools, NDK, CMake)
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          # Locate any available sdkmanager (prefer the newest cmdline-tools)
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: no sdkmanager found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          echo "Installing platforms;android-36, build-tools, NDK 26.1.10909125 and CMake 3.22.1..."
          yes | "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" \
            || echo "SDK package install reported a non-zero exit; continuing."

          echo "=== Installed repositories ==="
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/cmake" || true

          # Verify the critical components are present
          [ -d "$ANDROID_HOME/platforms/android-36" ] || { echo "ERROR: platform android-36 not installed"; exit 1; }
          [ -d "$ANDROID_HOME/ndk/26.1.10909125" ] || { echo "ERROR: NDK 26.1.10909125 not installed"; exit 1; }
          [ -d "$ANDROID_HOME/cmake/3.22.1" ] || { echo "ERROR: CMake 3.22.1 not installed"; exit 1; }
          echo "All critical SDK components are in place."

      - name: Ensure Native Submodules and Talloc Sources
        run: |
          echo "Checking third_party dependencies..."
          mkdir -p third_party/proot third_party/libandroid-shmem third_party/talloc

          # Clone proot if not present from submodule
          if [ ! -f "third_party/proot/src/cli/proot.c" ]; then
            echo "Cloning termux/proot..."
            rm -rf third_party/proot
            git clone --depth 1 https://github.com/termux/proot.git third_party/proot
          fi

          # Clone libandroid-shmem if not present from submodule
          if [ ! -f "third_party/libandroid-shmem/shmem.c" ]; then
            echo "Cloning termux/libandroid-shmem..."
            rm -rf third_party/libandroid-shmem
            git clone --depth 1 https://github.com/termux/libandroid-shmem.git third_party/libandroid-shmem
          fi

          # Download talloc sources if missing
          if [ ! -f "third_party/talloc/talloc.c" ] || [ ! -f "third_party/talloc/talloc.h" ]; then
            echo "Downloading talloc.c and talloc.h..."
            curl -fsSL https://raw.githubusercontent.com/samba-team/samba/master/lib/talloc/talloc.c -o third_party/talloc/talloc.c
            curl -fsSL https://raw.githubusercontent.com/samba-team/samba/master/lib/talloc/talloc.h -o third_party/talloc/talloc.h
          fi

      - name: Prepare Bundled Runtime Assets
        run: |
          mkdir -p dist/runtime-bundles
          if [ ! -f "dist/runtime-bundles/pocketdev-agy-arm64-2026.09.1.tar.zst" ]; then
            echo "Fetching pocketdev-agy runtime bundle asset..."
            curl -fSL --retry 3 --retry-delay 2 \
              https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4/pocketdev-agy-arm64-2026.09.1.tar.zst \
              -o dist/runtime-bundles/pocketdev-agy-arm64-2026.09.1.tar.zst || {
                echo "Creating fallback archive placeholder to ensure Gradle Sync succeeds..."
                touch dist/runtime-bundles/pocketdev-agy-arm64-2026.09.1.tar.zst
              }
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Online Debug APK (Installable)
        run: ./gradlew :app:assembleOnlineDebug -x lint --stacktrace

      - name: Build Online Release APK
        continue-on-error: true
        run: ./gradlew :app:assembleOnlineRelease -x lint --stacktrace

      - name: Sign Release APK If Unsigned
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools/ -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/online/release/ -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Checking release APK signature with apksigner..."
            if ! $BUILD_TOOLS_DIR/apksigner verify "$RELEASE_APK" 2>/dev/null; then
              echo "Release APK is unsigned. Generating temporary signing key and signing APK for direct installation..."
              keytool -genkeypair -v -keystore temp-release.jks -alias mobileharness -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=MobileHarness, OU=MobileHarness, O=MobileHarness, L=Unknown, S=Unknown, C=US"
              $BUILD_TOOLS_DIR/apksigner sign --ks temp-release.jks --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/online/release/mobile-harness-online-release-signed.apk "$RELEASE_APK"
              echo "Signed release APK created at app/build/outputs/apk/online/release/mobile-harness-online-release-signed.apk"
            fi
          fi

      - name: Prepare APK Artifacts for Upload
        run: |
          mkdir -p release-artifacts
          # Copy Debug APK (always fully signed by Android Gradle Plugin and ready to install)
          DEBUG_APK=$(find app/build/outputs/apk/online/debug/ -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "release-artifacts/mobile-harness-online-debug.apk"
          fi

          # Copy Signed Release APK if generated
          SIGNED_RELEASE_APK="app/build/outputs/apk/online/release/mobile-harness-online-release-signed.apk"
          if [ -f "$SIGNED_RELEASE_APK" ]; then
            cp "$SIGNED_RELEASE_APK" "release-artifacts/mobile-harness-online-release.apk"
          else
            # Otherwise check standard release apk
            RAW_RELEASE_APK=$(find app/build/outputs/apk/online/release/ -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$RAW_RELEASE_APK" ] && [ -f "$RAW_RELEASE_APK" ]; then
              cp "$RAW_RELEASE_APK" "release-artifacts/mobile-harness-online-release.apk"
            fi
          fi

          echo "=== Ready-to-install APK artifacts ==="
          ls -lh release-artifacts/

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-apk
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true

      - name: Generate Job Summary
        run: |
          echo "## 📱 Mobile Harness APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The APK packages are ready to be installed directly on your Android device (ARM64, Android 9+)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Installable Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| APK File | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for file in release-artifacts/*.apk; do
            if [ -f "$file" ]; then
              size=$(ls -lh "$file" | awk '{print $5}')
              sha=$(sha256sum "$file" | awk '{print $1}')
              name=$(basename "$file")
              echo "| **$name** | $size | \`$sha\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to install on your phone:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Summary** tab of this GitHub Actions run." >> $GITHUB_STEP_SUMMARY
          echo "2. Download the **mobile-harness-apk** artifact zip file." >> $GITHUB_STEP_SUMMARY
          echo "3. Extract and transfer \`mobile-harness-online-debug.apk\` (or release) to your phone." >> $GITHUB_STEP_SUMMARY
          echo "4. Tap the APK file to install, grant permissions if prompted, and launch!" >> $GITHUB_STEP_SUMMARY